# Cấu hình Alembic. URL kết nối không để ở đây: env.py lấy từ MigrateSettings (role migrator).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Chính sách roll-forward-only: chỉ thêm revision mới, không sửa revision đã phát hành
