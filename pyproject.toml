[project]
name = "chatbot-backend"
version = "0.1.0"
description = "RAG chatbot backend (FastAPI + LangChain/LangGraph + Postgres/pgvector + Redis)"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi==0.161.1",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.1",
    "python-multipart==0.0.32",
    # LangChain / LangGraph, LLM tương thích OpenAI (LLM tự host + Gemini)
    "langchain==1.4.7",
    "langchain-openai==1.7.2",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    # Postgres + pgvector, pool kết nối
    "psycopg[binary,pool]==3.3.6",
    "sqlalchemy[asyncio]==2.1.6",
    "pgvector==0.5.1",
    # Migration schema (alembic upgrade head)
    "alembic==1.20.1",
    # Cache
    "redis==8.1.0",
    # Gọi embedding / reranker / LLM qua HTTP
    "httpx==0.28.1",
    # Đọc PDF / Word khi nạp tài liệu
    "pypdf==6.21.3",
    "python-docx==1.2.0",
    # Auth
    "pyjwt==2.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pip-audit==2.10.1",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
extend-exclude = ["frontend"]

[tool.ruff.lint]
# Mức tối thiểu: lỗi cú pháp, tên chưa định nghĩa, import thừa. Siết dần khi codebase lớn lên.
select = ["E9", "F"]
