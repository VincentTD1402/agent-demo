# Chạy: docker compose up -d --build   (cần file .env: chạy scripts/init-env.sh hoặc scripts/init-env.ps1 để tạo từ .env.example)
# Thứ tự khởi động: db -> migrate -> (mcp-server, ingest) -> api -> frontend. Xem docs/deployment-guide.md.
# Các model (LLM / embedding / reranker) chạy ngoài compose, backend gọi qua host.docker.internal.
services:
  chatbot-db-prod:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-langchain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLIC_PORT:-6024}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Chạy một lần: alembic upgrade head. Thoát mã 0 thì api mới lên.
  migrate:
    build: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      chatbot-db-prod:
        condition: service_healthy
    networks: [internal]

  # Chạy một lần mỗi lần `up`: nạp tài liệu trong ./documents (chính sách, mô tả sản phẩm) vào pgvector cho chatbot.
  # Idempotent (file không đổi thì bỏ qua). Lỗi (vd endpoint embedding chưa lên) không chặn api; nạp lại: docker compose run --rm ingest
  ingest:
    build: .
    restart: "no"
    command: ["python", "-m", "app.documents.ingest_cli"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./documents:/srv/documents:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  # MCP server: tool giỏ hàng/đơn/hoàn tiền cho agent. Chỉ nằm trong mạng nội bộ (không publish cổng),
  # agent gọi tới với Bearer MCP_API_KEY; từ chối khởi động nếu thiếu khoá.
  mcp-server:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      chatbot-db-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  # Tên service `api` giữ nguyên vì frontend/nginx.conf.template proxy tới http://api:8000
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Linux không tự có host.docker.internal; dòng này làm nó trỏ về máy host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Thư mục tài liệu cho POST /documents/ingest-folder (chỉ đọc)
    volumes:
      - ./documents:/srv/documents:ro
      # Ảnh sản phẩm nhân viên tải lên: api ghi, nginx (frontend) phục vụ ở /uploads/products/
      - product-images:/srv/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully
      chatbot-db-prod:
        condition: service_healthy
      # Chờ MCP server để câu hỏi mua sắm đầu tiên đã có tool (thiếu MCP_API_KEY thì compose báo lỗi ngay ở đây)
      mcp-server:
        condition: service_healthy
    networks: [internal]

  # Giao diện chat (nginx); proxy /api -> api và gắn X-API-Key phía server
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:-}
    volumes:
      - product-images:/usr/share/nginx/uploads:ro
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
  product-images:

networks:
  internal:
