# Chạy: docker compose up -d --build   (cần file .env, xem .env.example)
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shopbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Công cụ của agent đóng gói thành MCP server (Streamable HTTP), chỉ nằm trong mạng nội bộ
  mcp-server:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server.server"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopbot}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopbot}
      MCP_SERVER_URL: http://mcp-server:8001/mcp
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
    networks: [internal]

  # Giao diện chat (nginx); proxy /api -> api và gắn X-API-Key phía server nên key không lộ ra trình duyệt
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
